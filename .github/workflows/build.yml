name: Build AYN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Backup my files
        run: |
          mkdir /tmp/backup
          cp pubspec.yaml /tmp/backup/
          cp -r lib /tmp/backup/
      
      - name: Create fresh Flutter project
        run: |
          cd ..
          rm -rf ayn-app
          flutter create --project-name ayn_app --org com.majd ayn-app
          cd ayn-app
      
      - name: Restore my files
        run: |
          cp /tmp/backup/pubspec.yaml ./pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib ./lib
      
      - name: Show current build.gradle structure
        run: |
          echo "=== Files in android/app/ ==="
          ls -la android/app/
          echo ""
          echo "=== Files in android/ ==="
          ls -la android/
      
      - name: Force compileSdk 34 (Kotlin DSL)
        run: |
          # كتابة ملف build.gradle.kts جديد بـ compileSdk 34
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.majd.ayn_app"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8.toString()
              }

              defaultConfig {
                  applicationId = "com.majd.ayn_app"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF
          
          echo "=== New build.gradle.kts ==="
          cat android/app/build.gradle.kts
      
      - name: Fix AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              
              <application
                  android:label="Ayn"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK Release
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayn-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
