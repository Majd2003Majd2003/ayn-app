name: Build AYN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # خطوة فحص المسارات - ستكشف لنا مكان مجلد android بالضبط
      - name: Debug File Structure
        run: |
          echo "Current Directory Content:"
          ls -R
          
      - name: Install dependencies
        run: flutter pub get

      - name: Patch Android Configuration
        run: |
          # البحث عن ملف build.gradle في كامل المستودع وتعديله أينما وجد
          find . -name "build.gradle" -path "*/android/app/*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' {} +
          find . -name "build.gradle" -path "*/android/app/*" -exec sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' {} +
          
          # تحديث Kotlin في الملف الرئيسي
          find . -name "build.gradle" -path "*/android/*" ! -path "*/app/*" -exec sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.20'/g" {} +
          
          # تحديث Kotlin في settings.gradle
          find . -name "settings.gradle" -path "*/android/*" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.20"/g' {} +

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayn-app-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
