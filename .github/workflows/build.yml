name: Build AYN APK (Fresh Rebuild)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Clean Build and Fix Gradle
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Reconstruct Project Structure
        run: |
          # 1. نسخ الملفات الأساسية لمكان آمن مؤقتاً
          mkdir -p /tmp/app_source
          cp -r lib /tmp/app_source/ || true
          cp pubspec.yaml /tmp/app_source/ || true
          [ -d "assets" ] && cp -r assets /tmp/app_source/ || true

          # 2. حذف كل شيء في المجلد الحالي لضمان النظافة
          rm -rf *
          rm -rf .??*

          # 3. إنشاء مشروع Flutter جديد تماماً بنفس الاسم
          # ملاحظة: استخدمنا اسم ayn_app لأنه الموصى به برمجياً (lowercase + underscore)
          flutter create --project-name ayn_app --org com.majd .

          # 4. استعادة كودك ومجلداتك الأصلية فوق المشروع الجديد
          cp -r /tmp/app_source/lib .
          cp /tmp/app_source/pubspec.yaml .
          [ -d "/tmp/app_source/assets" ] && cp -r /tmp/app_source/assets . || true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android Permissions
        run: |
          # إضافة الأذونات الضرورية للميكروفون والبوصلة في الملف الجديد
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <application
                  android:label="Ayn"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayn-app-final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
