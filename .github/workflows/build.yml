name: Build AYN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # هذا الجزء هو "المفتاح" لحل مشكلة lStar وتوافق Kotlin
      - name: Patch Gradle and Kotlin versions
        run: |
          # 1. تحديث compileSdkVersion إلى 34 لحل مشكلة lStar
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
          
          # 2. تحديث إصدار Kotlin ليتوافق مع المكتبات الحديثة
          # سنقوم بالبحث عن سطر ext.kotlin_version وتحديثه
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.20'/g" android/build.gradle
          fi
          
          # 3. تحديث ملف settings.gradle إذا كان يحتوي على تعريف الإضافة
          if [ -f "android/settings.gradle" ]; then
            sed -i "s/id \"org.jetbrains.kotlin.android\" version .*/id \"org.jetbrains.kotlin.android\" version \"1.9.20\" apply false/g" android/settings.gradle
          fi

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayn-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
