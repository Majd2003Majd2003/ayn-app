name: Build AYN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Flutter doctor
        run: flutter doctor -v
      
      - name: Backup my files
        run: |
          mkdir /tmp/backup
          cp pubspec.yaml /tmp/backup/
          cp -r lib /tmp/backup/
      
      - name: Create fresh Flutter project
        run: |
          cd ..
          rm -rf ayn-app
          flutter create --project-name ayn_app --org com.majd ayn-app
          cd ayn-app
      
      - name: Restore my files
        run: |
          cp /tmp/backup/pubspec.yaml ./pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib ./lib
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK Release
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayn-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
      
      - name: Show APK info
        run: |
          echo "Build Successful!"
          ls -lh build/app/outputs/flutter-apk/
